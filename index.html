<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lymolabs</title>
  <meta name="description" content="Lymo Labs is launching soon.">
  <meta name="theme-color" content="#1E1E1E">
  <link rel="icon" type="image/png" href="images/lymolabs-icon.png">
  <link rel="apple-touch-icon" href="images/lymolabs-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E1E1E;
      --ink-2: #262626;
      --paper: #F2F2F2;
      --muted: #9A9A9A;
      --green: #B0E585;
      --lime: #E2E29A;
      --orange: #E2802E;
      --line: rgba(242, 242, 242, .12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: "Urbanist", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- Background: flowing green wave ---------- */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg svg.wave {
      position: absolute;
      width: 140vw; height: 140vh;
      right: -30vw; top: -20vh;
      filter: blur(28px) saturate(1.05);
      animation: drift 14s ease-in-out infinite alternate;
    }
    .bg svg.wave .band-a { animation: sway 12s ease-in-out infinite alternate-reverse; transform-origin: center; }
    .bg svg.wave .band-b { animation: sway 9s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes drift {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to   { transform: translate3d(-6vw, 4vh, 0) rotate(-5deg); }
    }
    @keyframes sway {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-90px) scale(1.08); }
    }
    .bg .vignette {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, var(--ink) 0%, rgba(30,30,30,.92) 30%, rgba(30,30,30,.35) 60%, rgba(30,30,30,0) 100%),
        radial-gradient(120% 90% at 80% 50%, transparent 40%, rgba(20,20,20,.75) 100%);
    }
    .bg .grain {
      position: absolute; inset: -50%;
      opacity: .14; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ---------- Layout ---------- */
    .page {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 4vw, 48px) clamp(16px, 5vw, 72px);
    }
    header, footer {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }

    .logo { display: inline-flex; }
    .logo img { height: 31px; width: auto; }

    footer { font-size: 18px; color: var(--muted); flex-wrap: wrap; }
    footer nav { display: flex; gap: 32px; }
    footer a { color: var(--muted); text-decoration: none; transition: color .2s; }
    footer a:hover { color: var(--paper); }

    /* Entrance */
    .rise { opacity: 0; transform: translateY(18px); animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .22s } .d3 { animation-delay: .34s } .d4 { animation-delay: .46s }
    @keyframes rise { to { opacity: 1; transform: none; } }

    @media (max-width: 640px) {
      .bg .vignette { background: linear-gradient(180deg, rgba(30,30,30,.55) 0%, rgba(30,30,30,.9) 55%, var(--ink) 100%); }
      footer { flex-direction: column-reverse; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .rise { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <svg class="wave" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2E4A1C"/>
          <stop offset=".45" stop-color="#8DBB63"/>
          <stop offset=".7" stop-color="#CFE8B2"/>
          <stop offset="1" stop-color="#4F7A2E"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#1B2A12"/>
          <stop offset=".5" stop-color="#A9D47F"/>
          <stop offset="1" stop-color="#E6F2D6"/>
        </linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#121a0c" stop-opacity="0"/>
          <stop offset=".6" stop-color="#3C5E22"/>
          <stop offset="1" stop-color="#6E9A47"/>
        </linearGradient>
      </defs>
      <rect width="1600" height="1000" fill="#24361A"/>
      <path d="M0 620 C 300 380, 620 760, 900 520 S 1400 160, 1600 260 L1600 1000 L0 1000Z" fill="url(#g3)"/>
      <path class="band-a" d="M-100 900 C 250 700, 500 520, 820 470 S 1300 260, 1700 120 L1700 420 C 1350 520, 1100 640, 820 700 S 300 900, -100 1100Z" fill="url(#g1)"/>
      <path class="band-b" d="M200 1100 C 520 860, 760 760, 1020 700 S 1450 560, 1700 520 L1700 1000 L200 1100Z" fill="url(#g2)" opacity=".85"/>
      <path d="M-100 200 C 300 120, 700 300, 1000 180 S 1500 -40, 1700 0 L1700 -100 L-100 -100Z" fill="#141e0d" opacity=".9"/>
    </svg>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <div class="page">
    <header class="rise">
      <a class="logo" href="/">
        <img src="images/lymolabs-logo.png" alt="Lymo Labs">
      </a>
    </header>

    <main></main>

    <footer class="rise d4">
      <nav aria-label="Social">
        <a href="mailto:info@lymolabs.com">info@lymolabs.com</a>
        <a href="https://www.linkedin.com/company/lymolabs/" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </footer>
  </div>

</body>
</html>
